plugins {
    id 'java-library'
}

repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Concentus Opus codec from GitHub - use api instead of implementation
    // so that dependent modules (desktop, android) can access it
    api 'com.github.lostromb:concentus:master-SNAPSHOT'

    // Audio format support libraries
    api 'com.googlecode.soundlibs:tritonus-share:0.3.7.4'
    api 'com.googlecode.soundlibs:vorbisspi:1.0.3.3'  // OGG Vorbis decode
    api 'org.gagravarr:vorbis-java-core:0.8'  // OGG Vorbis encode/decode

    // Logging
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'ch.qos.logback:logback-classic:1.4.11'
}

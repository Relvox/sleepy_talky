plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sleepy.recorder.android'
    compileSdk 36

    defaultConfig {
        applicationId "com.sleepy.recorder"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA']
        }
    }
}

dependencies {
    implementation(project(':core')) {
        // Exclude classes that use javax.sound (desktop-only)
        exclude module: 'javax.sound.sampled'
    }

    // Add core dependencies directly since we're using the core module
    implementation 'com.github.lostromb:concentus:master-SNAPSHOT'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
